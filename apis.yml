name: Sahara AI
description: >-
  Sahara AI is a decentralized AI platform (backed by Pantera Capital) building
  infrastructure for the agentic economy: an AI Developer Platform for building
  agents, managing datasets, and accessing compute; an AI Marketplace for
  publishing and monetizing AI solutions; a Data Services Platform for
  collecting, labeling, and validating training data; consumer agents such as
  Sorin (autonomous trading); and the Sahara blockchain with the $SAHARA token
  for settlement and governance. Its developer-facing surface is an
  OpenAI-compatible Compute API that routes inference across multiple upstream
  providers (OpenAI, Lepton, Together, and others) alongside model- and
  provider-discovery endpoints, authenticated with an API key.
